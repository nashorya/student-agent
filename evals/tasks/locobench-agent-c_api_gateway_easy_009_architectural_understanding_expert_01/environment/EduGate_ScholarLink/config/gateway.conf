/*
 * ======================================================================
 * EduGate ScholarLink - Gateway Configuration (Compiled-In)
 * File: EduGate_ScholarLink/config/gateway.conf
 *
 * This file is written in C so that the configuration can be compiled
 * directly into the gateway binary, eliminating the need for a separate
 * runtime parser and ensuring type–safety across the entire build.
 *
 * The configuration expresses:
 *   • Gateway-wide metadata
 *   • Upstream micro-service registry
 *   • Route table with pedagogic labels, throttling, validation, etc.
 *   • Monitoring & circuit-breaker policies
 *
 * To update the behaviour of the gateway, edit this file and rebuild.
 * ======================================================================
 */

#ifndef EDUGATE_SCHOLARLINK_GATEWAY_CONF
#define EDUGATE_SCHOLARLINK_GATEWAY_CONF

/* ---- Standard Library ---------------------------------------------------- */
#include <stddef.h>

/* ---- Gateway Core Abstractions ------------------------------------------ */
/*
 * The typedefs below are forward-declared because we do not include the
 * full gateway headers in this self-contained snippet.  In the real
 * codebase they would live in <gateway/core.h> and <gateway/types.h>.
 */
typedef enum {
    HTTP_GET,
    HTTP_POST,
    HTTP_PUT,
    HTTP_PATCH,
    HTTP_DELETE
} http_method_t;

typedef struct {
    unsigned int quota;        /* Max # tokens per window           */
    unsigned int window_sec;   /* Sliding-window in seconds         */
} rate_limit_t;

typedef enum {
    VAL_POLICY_NONE,
    VAL_POLICY_JSON_SCHEMA,
    VAL_POLICY_GRAPHQL,
    VAL_POLICY_FORM_URLENCODED
} validation_policy_t;

typedef struct {
    const char *name;          /* Unique service identifier         */
    const char *url;           /* Upstream base URL                 */
    unsigned    timeout_ms;    /* HTTP timeout to upstream          */
    unsigned    max_retries;   /* Automatic retry attempts          */
} upstream_service_t;

/* ---- Route Definition ---------------------------------------------------- */
typedef struct {
    const char        *path;              /* e.g. "/v1/quiz"               */
    http_method_t      method;            /* GET/POST/etc.                 */
    const char        *service_name;      /* Upstream lookup key           */
    const char        *pedagogic_label;   /* Used by dashboards            */
    rate_limit_t       rate_limit;        /* Throttling policy             */
    validation_policy_t validation;       /* Request/Response validation   */
    unsigned           require_auth : 1;  /* 1 => JWT / 0 => public        */
    unsigned           enable_graphql :1; /* GraphQL stitching required    */
    unsigned           reserved      :6;  /* Future flags, keep zero       */
} route_conf_t;

/* ---- Gateway-wide Settings ---------------------------------------------- */
typedef struct {
    const char  *version_tag;         /* Curriculum year versioning      */
    size_t       num_services;        /* # of entries in services[]      */
    size_t       num_routes;          /* # of entries in routes[]        */
    const upstream_service_t *services;
    const route_conf_t        *routes;

    /* Monitoring */
    unsigned metrics_push_interval_sec;
    unsigned circuit_breaker_half_life_sec;
} gateway_conf_t;

