/* ------------------------------------------------------------------------- */
/*  Global Gateway Configuration Instance                                    */
/* ------------------------------------------------------------------------- */
static const gateway_conf_t G_GATEWAY_CONF = {
    .version_tag                     = "v2024_Spring",
    .num_services                    = sizeof(G_UPSTREAM_SERVICES) / sizeof(G_UPSTREAM_SERVICES[0]),
    .num_routes                      = sizeof(G_ROUTES) / sizeof(G_ROUTES[0]),
    .services                        = G_UPSTREAM_SERVICES,
    .routes                          = G_ROUTES,
    .metrics_push_interval_sec       = 10,   /* Push metrics every 10 s   */
    .circuit_breaker_half_life_sec   = 30    /* Half-open after 30 s      */
};

/* ------------------------------------------------------------------------- */
/*  Public Accessor                                                          */
/* ------------------------------------------------------------------------- */
/*
 * Returns a read-only pointer to the compiled-in configuration.
 * The object is allocated in .rodata and is guaranteed to stay alive
 * for the duration of the process.
 */
static inline const gateway_conf_t *gateway_conf_get(void)
{
    return &G_GATEWAY_CONF;
}

#endif /* EDUGATE_SCHOLARLINK_GATEWAY_CONF */